name: Check public links
on:
  workflow_dispatch:
  push:
    branches: ["arena/e6321f12-trading"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate URLs
        run: |
          SHA=$(echo "${{ github.sha }}")
          echo "SHA=$SHA"
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)
          echo "SHORT=$SHA_SHORT"
          URLS="
          https://cdn.jsdelivr.net/gh/muhamaddshokirov-source/Trading@${SHA}/index.html
          https://cdn.jsdelivr.net/gh/muhamaddshokirov-source/Trading@main/index.html
          https://raw.githack.com/muhamaddshokirov-source/Trading/${SHA}/index.html
          https://cdn.statically.io/gh/muhamaddshokirov-source/Trading/${SHA}/index.html
          https://raw.githubusercontent.com/muhamaddshokirov-source/Trading/${SHA}/index.html
          "
          for u in $URLS; do
            echo "---- $u"
            curl -sSL -m 25 -o /tmp/out.html -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "$u" || echo "curl failed"
            head -c 120 /tmp/out.html 2>/dev/null | tr '\n' ' '; echo
          done
          echo "===== SUBRESOURCES (jsdelivr) ====="
          for p in assets/css/styles.css assets/js/charts.js assets/favicon.svg; do
            printf "%-32s " "$p"
            curl -sSL -m 20 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type}\n' "https://cdn.jsdelivr.net/gh/muhamaddshokirov-source/Trading@${SHA}/${p}"
          done
          echo "===== RESOLVE BRANCH WITH SLASH ====="
          curl -sS -m 20 -o /dev/null -w 'githack-branch HTTP=%{http_code}\n' "https://raw.githack.com/muhamaddshokirov-source/Trading/arena/e6321f12-trading/index.html" || true
