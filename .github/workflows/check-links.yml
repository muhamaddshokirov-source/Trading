name: Check public links
on:
  workflow_dispatch:
  push:
    branches: ["arena/e6321f12-trading"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe githack
        run: |
          set +e
          REPO="muhamaddshokirov-source/Trading"
          OUT="link-report.txt"
          SHA="${{ github.sha }}"
          : > $OUT
          echo "sha=$SHA" >> $OUT
          echo "=== PAGES via branch ===" >> $OUT
          for p in index.html trades.html analytics.html journal.html pricing.html; do
            printf "%-16s " "$p" >> $OUT
            curl -sSL -m 25 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "https://raw.githack.com/${REPO}/arena/e6321f12-trading/${p}" >> $OUT
          done
          echo "=== ASSETS via branch ===" >> $OUT
          for p in assets/css/styles.css assets/js/i18n.js assets/js/data.js assets/js/charts.js assets/js/shell.js assets/js/dashboard.js assets/js/trades.js assets/js/analytics.js assets/js/journal.js assets/js/pricing.js assets/favicon.svg; do
            printf "%-30s " "$p" >> $OUT
            curl -sSL -m 25 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "https://raw.githack.com/${REPO}/arena/e6321f12-trading/${p}" >> $OUT
          done
          echo "=== SECOND PASS (cache / stability) ===" >> $OUT
          for i in 1 2 3; do
            printf "attempt %s: " "$i" >> $OUT
            curl -sSL -m 25 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type} TIME=%{time_total}s\n' "https://raw.githack.com/${REPO}/arena/e6321f12-trading/index.html" >> $OUT
          done
          cat $OUT
      - name: Commit report
        run: |
          git config user.name "link-bot"
          git config user.email "bot@users.noreply.github.com"
          git add link-report.txt
          git commit -m "chore: link probe report [skip ci]" || echo "no changes"
          git push || echo "push failed"
