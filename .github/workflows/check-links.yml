name: Check public links
on:
  workflow_dispatch:
  push:
    branches: ["arena/e6321f12-trading"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate URLs
        run: |
          set +e
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          REPO="muhamaddshokirov-source/Trading"
          OUT="link-report.txt"
          : > $OUT
          echo "sha=$SHA short=$SHORT" >> $OUT
          probe () {
            printf "%-105s " "$1" >> $OUT
            curl -sSL -m 25 -o /tmp/body -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}' "$1" >> $OUT 2>&1
            echo "" >> $OUT
            head -c 80 /tmp/body 2>/dev/null | tr '\n' ' ' >> $OUT; echo "" >> $OUT
          }
          for u in \
            "https://cdn.jsdelivr.net/gh/${REPO}@${SHA}/index.html" \
            "https://cdn.jsdelivr.net/gh/${REPO}@main/index.html" \
            "https://raw.githack.com/${REPO}/${SHA}/index.html" \
            "https://raw.githack.com/${REPO}/arena/e6321f12-trading/index.html" \
            "https://cdn.statically.io/gh/${REPO}/${SHA}/index.html" \
            "https://raw.githubusercontent.com/${REPO}/${SHA}/index.html" ; do
            probe "$u"
          done
          echo "--- subresources on jsdelivr ---" >> $OUT
          for p in assets/css/styles.css assets/js/charts.js assets/js/i18n.js assets/favicon.svg; do
            printf "%-40s " "$p" >> $OUT
            curl -sSL -m 20 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "https://cdn.jsdelivr.net/gh/${REPO}@${SHA}/${p}" >> $OUT
          done
          echo "--- subresources on githack ---" >> $OUT
          for p in assets/css/styles.css assets/js/charts.js; do
            printf "%-40s " "$p" >> $OUT
            curl -sSL -m 20 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "https://raw.githack.com/${REPO}/${SHA}/${p}" >> $OUT
          done
          cat $OUT
      - name: Commit report
        run: |
          git config user.name "link-bot"
          git config user.email "bot@users.noreply.github.com"
          git add link-report.txt
          git commit -m "chore: link probe report [skip ci]" || echo "no changes"
          git push || echo "push failed"
